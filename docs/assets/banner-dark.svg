<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DBMux — development databases, connected to your AI coding workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#12151a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- mark -->
  <rect x="72" y="102" width="96" height="96" rx="20" fill="url(#tile)" stroke="#262a32" stroke-width="1.5"/>
  <text x="120" y="164" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="1.5" fill="#e8e8ec" text-anchor="middle">DB</text>
  <circle cx="159" cy="111" r="8" fill="#4ade80" stroke="#0d0f14" stroke-width="3.5"/>

  <!-- wordmark -->
  <text x="208" y="118" font-family="'Cascadia Code','SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="4.4" fill="#4ade80">SELF-HOSTED MCP GATEWAY</text>
  <text x="200" y="181" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#f5f5f7">DBMux</text>
  <text x="202" y="225" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17.5" fill="#9aa0ab">Development databases, connected to your AI coding workflow.</text>

  <!-- console card motif -->
  <rect x="872" y="72" width="258" height="156" rx="14" fill="#0f1116" stroke="#23262e" stroke-width="1.5"/>
  <circle cx="898" cy="98" r="4.5" fill="#2e333d"/>
  <circle cx="916" cy="98" r="4.5" fill="#2e333d"/>
  <circle cx="934" cy="98" r="4.5" fill="#4ade80" fill-opacity="0.9"/>
  <rect x="894" y="124" width="150" height="9" rx="4.5" fill="#22262e"/>
  <rect x="894" y="145" width="198" height="9" rx="4.5" fill="#22262e"/>
  <rect x="894" y="166" width="108" height="9" rx="4.5" fill="#4ade80" fill-opacity="0.55"/>
  <rect x="894" y="187" width="172" height="9" rx="4.5" fill="#22262e"/>
</svg>
