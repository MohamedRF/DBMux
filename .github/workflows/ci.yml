name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Check formatting
        run: npm run format:check
      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          TEST_PG_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(24).toString('hex'))")"
          echo "::add-mask::$TEST_PG_PASSWORD"
          echo "TEST_PG_PASSWORD=$TEST_PG_PASSWORD" >> "$GITHUB_ENV"
          export TEST_PG_PASSWORD
          docker compose -p dbmuxverify -f docker-compose.test.yml up -d --wait
      - name: Run tests including live PostgreSQL
        run: npm test
      - name: Build
        run: npm run build
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -n "$TEST_PG_PASSWORD" ]; then
            docker compose -p dbmuxverify -f docker-compose.test.yml down
          fi
